# THREATCAST development foundation (Phase 1).
# Later phases extend these services; do not add new services without updating CONTRACT.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatcast
      POSTGRES_PASSWORD: threatcast
      POSTGRES_DB: threatcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatcast -d threatcast"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://threatcast:threatcast@postgres:5432/threatcast
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ML_ARTIFACTS_DIR: /app/ml/artifacts
      ML_DEVICE: ${ML_DEVICE:-auto}
      TIME_WINDOW_SECONDS: ${TIME_WINDOW_SECONDS:-10}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    volumes:
      # live model artifacts without image rebuild
      - ./ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      FRONTEND_PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
